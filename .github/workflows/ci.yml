name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,integrations]"
      - run: ruff check .
      - run: mypy apps packages scripts
      - run: pytest --cov=apps --cov=packages --cov-report=term-missing
        env:
          COVERAGE_FILE: .coverage
      - run: coverage report --include="packages/auth/*,packages/security/*,packages/backtesting/engine.py,packages/paper_trading/*,packages/market_data/quality.py" --fail-under=80
      - run: coverage xml -o coverage.xml
      - name: Upload backend coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Clean migration and schema-drift check
        env:
          MIL_DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec vitest run --coverage
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: apps/web/coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm run build

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mil_test
          POSTGRES_PASSWORD: mil_test
          POSTGRES_DB: mil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mil_test -d mil_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIL_DATABASE_URL: postgresql+psycopg://mil_test:mil_test@127.0.0.1:5432/mil_test
      MIL_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://mil_test:mil_test@127.0.0.1:5432/mil_test
      MIL_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,postgres,integrations]"
      - run: alembic upgrade 7f4af62df2fe
      - run: alembic upgrade 61293cddc2e2
      - run: alembic upgrade 2f9e39afd435
      - run: alembic upgrade e2517ff0412b
      - run: alembic upgrade 4e398fc4c9a1
      - run: alembic upgrade head
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m postgres
      - run: python scripts/benchmark_economic_graph.py --sizes 10000:50000 --postgres-url-env MIL_POSTGRES_TEST_DATABASE_URL
      - run: python scripts/benchmark_feature_store.py --postgres-url-env MIL_POSTGRES_TEST_DATABASE_URL
      - run: python scripts/benchmark_hypothesis_research.py --postgres-url-env MIL_POSTGRES_TEST_DATABASE_URL
      - run: python -m scripts.benchmark_prospective_intelligence
      - run: python -m scripts.benchmark_private_beta_operations --database-url-env MIL_POSTGRES_TEST_DATABASE_URL

  postgres18-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: mil_test
          POSTGRES_PASSWORD: mil_test
          POSTGRES_DB: mil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mil_test -d mil_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIL_DATABASE_URL: postgresql+psycopg://mil_test:mil_test@127.0.0.1:5432/mil_test
      MIL_POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://mil_test:mil_test@127.0.0.1:5432/mil_test
      MIL_ENVIRONMENT: test
      MIL_PHASE5_FIXTURE_EXPECTED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,postgres,integrations]"
      - run: alembic upgrade 3b2f6c7d8e90
      - run: python -m scripts.seed_phase5_reconciliation_fixture
      - run: python -m scripts.phase5_reconciliation_check --json --snapshot-output phase5-before.json
      - run: alembic upgrade head
      - run: alembic upgrade head
      - run: python -m scripts.phase5_reconciliation_check --require-head --json --compare-snapshot phase5-before.json
      - run: alembic current
      - run: alembic heads
      - run: alembic history
      - run: alembic check
      - run: pytest -m postgres tests/test_phase5_reconciliation.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0, run_install: false }
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,integrations]"
      - run: pip check
      - run: python scripts/validate_upstream.py
      - run: pip-audit --skip-editable
      - run: cyclonedx-py environment --output-format JSON --output-file backend-sbom.json
      - run: pip-licenses --format=json --output-file=python-licenses.json
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm audit --audit-level high
        working-directory: apps/web
      - run: pnpm licenses list --json > npm-licenses.json
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain-reports
          path: |
            backend-sbom.json
            python-licenses.json
            apps/web/npm-licenses.json
