[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-lab"
version = "0.14.1"
description = "Historical market-data research, backtesting, and simulated paper-trading platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "exchange-calendars>=4.13,<5",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "cyclonedx-bom>=7,<8",
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]
postgres = ["psycopg[binary]>=3.2,<4"]
observability = ["sentry-sdk[fastapi]>=2,<3"]
integrations = [
  "edgartools==5.43.1",
  "numpy==2.5.1",
  "quantstats==0.0.81",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "skfolio==0.20.1",
  "statsmodels==0.14.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires an explicitly configured disposable PostgreSQL database",
  "live_provider: performs one explicitly enabled bounded provider request",
  "live_sec: performs one explicitly enabled bounded SEC request",
  "live_world_data: performs an explicitly enabled bounded FRED, ALFRED, or EIA request",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008",  # FastAPI's documented dependency-injection pattern.
  "S101",  # Assertions are appropriate in tests.
  "S104",  # Container entrypoint intentionally binds its isolated service to all interfaces.
  "S311",  # Fixed pseudo-random generator is intentional for synthetic deterministic data.
  "S603",  # Development commands are fixed lists, never user-provided shell strings.
  "S606",  # Container uses exec to preserve signal handling as PID 1.
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["migrations/versions"]
