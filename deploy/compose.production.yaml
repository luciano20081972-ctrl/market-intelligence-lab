name: market-intelligence-lab

x-api-image: &api-image
  image: mil-api:${MIL_IMAGE_TAG:?unique MIL_IMAGE_TAG required}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.production

x-runtime: &runtime
  restart: unless-stopped
  env_file:
    - ${MIL_ENV_FILE:?protected MIL_ENV_FILE required}
  secrets:
    - mil_database_url
  volumes:
    - ${MIL_RAW_OBJECT_HOST_PATH:?persistent raw path required}:/app/data/raw
    - ${MIL_BACKUP_HOST_PATH:?persistent backup path required}:/app/data/backups
  networks:
    - infra_backend
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  api:
    <<: [*api-image, *runtime]
    container_name: mil-api
    command: ["sh", "-c", "export MIL_DATABASE_URL=$$(cat /run/secrets/mil_database_url); exec python scripts/container_start.py"]
    networks:
      infra_backend: {}
      web_frontend:
        aliases: [api, mil-api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 256

  market-data-worker:
    <<: [*api-image, *runtime]
    container_name: mil-worker
    command: ["sh", "-c", "export MIL_DATABASE_URL=$$(cat /run/secrets/mil_database_url); exec python -m packages.market_data.worker --poll-interval 5 --lease-seconds 60 --json-logs"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "export MIL_DATABASE_URL=$$(cat /run/secrets/mil_database_url); python -m packages.market_data.worker --health >/dev/null"]
      interval: 30s
      timeout: 30s
      retries: 4
      start_period: 20s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 192

  scheduler:
    <<: [*api-image, *runtime]
    container_name: mil-scheduler
    command: ["sh", "-c", "export MIL_DATABASE_URL=$$(cat /run/secrets/mil_database_url); exec python -m packages.operations.scheduler --json-logs"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 160m
    cpus: 0.15
    pids_limit: 96

  operations-worker:
    <<: [*api-image, *runtime]
    container_name: mil-operations-worker
    command: ["sh", "-c", "export MIL_DATABASE_URL=$$(cat /run/secrets/mil_database_url); exec python -m packages.operations.worker --json-logs"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 320m
    cpus: 0.35
    pids_limit: 128

  web:
    image: mil-web:${MIL_IMAGE_TAG:?unique MIL_IMAGE_TAG required}
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_SUPABASE_URL: ${MIL_SUPABASE_URL:?Supabase URL required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${MIL_SUPABASE_PUBLISHABLE_KEY:?publishable key required}
    container_name: mil-web
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
    networks:
      web_frontend: {aliases: [mil-web]}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 15s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  infra_backend: {external: true, name: infra_backend}
  web_frontend: {external: true, name: web_frontend}

secrets:
  mil_database_url:
    file: ${MIL_DATABASE_URL_FILE:?database URL secret file required}
