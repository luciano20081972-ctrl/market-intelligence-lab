# Optional override. Use only when an approved backend operation genuinely
# requires a Supabase secret key; ordinary JWT/JWKS authentication does not.
services:
  api:
    secrets:
      - mil_supabase_secret_key

secrets:
  mil_supabase_secret_key:
    file: ${MIL_SUPABASE_SECRET_KEY_HOST_FILE:?protected Supabase secret file required}
